name: Vérifications Docker et LDAP
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Fixed CI address, independent of any deployment .env file in the checkout.
    env:
      DASHBOARD_PUBLIC_URL: http://localhost:8090
      DASHBOARD_PORT: "8090"
      DASHBOARD_BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Valider Compose
        run: docker compose config --quiet
      - name: Construire l’image de test PHP 8.5
        run: docker build --target test -t esede-ecrans:test .
      - name: Tester LDAP, autorisations et box simulées
        run: |
          docker run --rm --entrypoint python3 -e DASHBOARD_DATA_DIR= esede-ecrans:test tests/integration.py
          docker run --rm --entrypoint php esede-ecrans:test tests/deployment.php
      - name: Préparer les dossiers persistants de test
        run: |
          sudo install -d -o 33 -g 33 -m 700 /home/esede-admin/Docker-volumes/screen/data
          sudo install -d -o root -g 33 -m 750 /home/esede-admin/Docker-volumes/screen/config
          printf 'config-volume-ok\n' | sudo tee /home/esede-admin/Docker-volumes/screen/config/ci-volume-check >/dev/null
          sudo chown root:33 /home/esede-admin/Docker-volumes/screen/config/ci-volume-check
          sudo chmod 640 /home/esede-admin/Docker-volumes/screen/config/ci-volume-check
      - name: Créer les réseaux externes sur le runner de test
        run: |
          docker network create www
          docker network create nginx
      - name: Démarrer la version de production
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Vérifier HTTP, protection et persistance
        run: sh tests/docker-smoke.sh
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Nettoyer les conteneurs de test
        if: always()
        run: docker compose down -v
