name: Vérifications Docker et LDAP
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Valider Compose
        run: docker compose config --quiet
      - name: Construire l’image de test PHP 8.5
        run: docker build --target test -t esede-ecrans:test .
      - name: Tester LDAP, autorisations et box simulées
        run: |
          docker run --rm --entrypoint python3 -e DASHBOARD_DATA_DIR= esede-ecrans:test tests/integration.py
          docker run --rm --entrypoint php esede-ecrans:test tests/deployment.php
      - name: Démarrer la version de production
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Vérifier HTTP, protection et persistance
        run: sh tests/docker-smoke.sh
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Nettoyer les conteneurs de test
        if: always()
        run: docker compose down -v
