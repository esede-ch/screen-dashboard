ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 120

<VirtualHost *:8080>
    DocumentRoot /var/www/dashboard/public
    <Directory /var/www/dashboard/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    # No query string, cookie, token or password in access logs.
    LogFormat "%h %t \"%m %U %H\" %>s %b" dashboard
    CustomLog /proc/self/fd/1 dashboard
    ErrorLog /proc/self/fd/2
</VirtualHost>

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 5
    MaxRequestWorkers 16
    MaxConnectionsPerChild 500
</IfModule>
