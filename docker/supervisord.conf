[supervisord]
nodaemon=true
pidfile=/tmp/dashboard-supervisor.pid
logfile=/dev/stderr
logfile_maxbytes=0
childlogdir=/tmp
umask=0077

[program:apache]
command=/usr/local/bin/docker-php-entrypoint apache2-foreground
autorestart=true
stopsignal=WINCH
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:capture-monitor]
command=/usr/local/bin/php /var/www/dashboard/src/capture-monitor.php
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
