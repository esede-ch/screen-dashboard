<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connexion esede — Maquette</title>
  <link rel="stylesheet" href="connexion.css">
  <script src="connexion.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <section class="photo-panel" aria-label="Bâtiment de l’esede">
      <img src="assets/esede-photo.jpg" alt="Bâtiment de l’esede entouré de feuillages d’automne" class="building" fetchpriority="high">
      <div class="photo-shade"></div>
      <p class="photo-caption">Gestion des écrans d’affichage.</p>
    </section>
    <section class="connection-panel" aria-labelledby="login-title">
      <header class="brand-header">
        <a href="https://www.esede.ch/" aria-label="Site de l’esede"><img src="assets/esede-logo.png" alt="esede — école supérieure en éducation de l’enfance" width="700" height="292"></a>
      </header>
      <div class="connection-content">
        <h1 id="login-title">Connexion</h1>
        <p class="intro">Connexion avec un compte esede.</p>
        <div class="login-form" role="group" aria-label="Formulaire de connexion de démonstration">
          <div class="field"><label for="username">Nom d’utilisateur</label><input id="username" name="username" type="text" placeholder="Identifiant esede" autocapitalize="none" autocomplete="off" spellcheck="false"></div>
          <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" placeholder="Mot de passe esede" autocomplete="off"></div>
          <button id="connect" type="button">Se connecter</button>
          <p id="demo-message" class="demo-message" role="status" hidden>Maquette de présentation : aucune information n’est envoyée. La connexion réelle est disponible sur le dashboard.</p>
        </div>
      </div>
      <footer class="connection-footer">
        <p>esede · École supérieure en éducation de l’enfance</p>
        <div><span>Maquette de connexion</span><a href="/login.php">Dashboard actuel <span aria-hidden="true">↗</span></a></div>
      </footer>
    </section>
  </main>
</body>
</html>
